# ------------------------------------------------------------
# REDIRECCIÓN DE HTTP → HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    server_name lab.local asir.local;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# SERVIDOR HTTPS
# CONFIGURACIÓN COMPLETA COMPATIBLE CON NEXTCLOUD FPM
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name lab.local asir.local;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/nextcloud.crt;
    ssl_certificate_key /etc/nginx/certs/nextcloud.key;

    # Seguridad
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Raíz del sitio
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 1024M;
    fastcgi_buffers 64 4K;

    # ------------------------------------------------------------
    # RUTA PRINCIPAL
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # ------------------------------------------------------------
    # PHP: conecta con Nextcloud FPM
    # ------------------------------------------------------------
    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_pass nextcloud:9000;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
    }

    # ------------------------------------------------------------
    # ARCHIVOS ESTÁTICOS OPTIMIZADOS
    # ------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|bmp|ico|png|svg|webp)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }

    location ~* \.(?:woff|woff2|ttf|otf)$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }

    # ------------------------------------------------------------
    # WELL-KNOWN (caldav/carddav)
    # ------------------------------------------------------------
    location = /.well-known/carddav {
        return 301 /remote.php/dav/;
    }

    location = /.well-known/caldav {
        return 301 /remote.php/dav/;
    }

    # ------------------------------------------------------------
    # BLOQUEOS DE SEGURIDAD
    # ------------------------------------------------------------
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
        deny all;
    }

    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        deny all;
    }
}

